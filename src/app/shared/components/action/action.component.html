
<button type="button" class="btn btn-{{color}}" (click)="bClick()" [disabled]="action.retorno.carregando">
  @if (!action.retorno.carregando) {
    <i class="{{action.icon}}"></i>
  }
  @if (action.retorno.carregando) {
    <span class="spinner-border spinner-border-sm" aria-hidden="true"></span>
  }
  {{action.label}}
</button>
