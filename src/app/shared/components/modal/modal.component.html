<ng-template #template>
  @if (showHeader) {
    <div class="modal-header modal-xl">
      <h4 class="modal-title pull-left" [attr.id]="ariaLabelledBy">{{title}}</h4>
      <button type="button" class="btn-close close pull-right" aria-label="Close" [disabled]="fechamentoBloqueado" (click)="fecharPeloX()">
        <span aria-hidden="true" class="visually-hidden">&times;</span>
      </button>
    </div>
  }
  <div class="modal-body">
    <ng-content></ng-content>
  </div>
</ng-template>
