<div class="progress w-100" [ngStyle]="{ height: height }" aria-label="Progresso">
  <div
    [ngClass]="progressBarClasses"
    role="progressbar"
    [style.width.%]="percent"
    [attr.aria-valuenow]="percent"
    aria-valuemin="0"
    aria-valuemax="100"
    >
    @if (showText) {
      {{ percent | number: '1.0-0' }}%
    }
  </div>
</div>

@if (showCounter) {
  <div class="small text-muted mt-1">
    {{ current }} / {{ total }}
  </div>
}
