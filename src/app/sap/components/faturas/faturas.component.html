
@if (!finalizado) {
  <section class="content">
    <br />
    @if (clienteSelecionado) {
      <app-lista-fatura
        [clienteSelecionado]="clienteSelecionado"
        (closeEvent)="close()">
      </app-lista-fatura>
    }
    @if (contatosOpcoes && !clienteSelecionado) {
      <app-auth-fatura
        [opcoes]="contatosOpcoes"
        [cpf]="cpfCnpjInput"
        (getCodigo)="recebeCodigo($event)">
      </app-auth-fatura>
    }
    @if (!contatosOpcoes && !this.clienteSelecionado) {
      <div class="card card-primary">
        <div class="card-header">
          <h3 class="card-title"><b>Extrato de 2ª Via de fatura</b></h3>
        </div>
        <div class="card-body">
          <div class="form-group">
            <label for="cpfCnpj">Entre com CPF ou CNPJ</label>
            <input type="text" placeholder="CPF ou CNPJ"
              class="form-control" id="cpfCnpj"
              [ngModel]="cpfCnpjInput | cpfCnpj"
              (ngModelChange)="cpfCnpjInput=$event">
          </div>
          <div class="form-group">
            <button (click)="buscarContatos()" [disabled]="disableAvancar" class="btn btn-primary" >Avançar</button>
          </div>
        </div>
        <div class="card-footer text-muted small">
          Canal de atendimento - {{phoneNumber}}
        </div>
      </div>
    }
  </section>
}
