<div class="form-group">
  <label>Filiais: &nbsp;</label>
  <select class="form-control" [(ngModel)] ="currentValue" name="filial" (ngModelChange)="change(currentValue)">
    <option selected [ngValue]="'all'">Todos</option>
    @for (item of businessPlaces; track item) {
      <option  [ngValue]="item">{{item.Bplname}}</option>
    }
  </select>
</div>
