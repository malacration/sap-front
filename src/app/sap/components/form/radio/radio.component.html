<div class="form-group">
  @for (item of opcoes; track item) {
    <div class="form-check form-check-inline">
      <input class="form-check-input" type="radio"
        [id]="groupName + '-' + item.content"
        [name]="groupName"
        [checked]="selected == item.content"
        (change)="handleChange(item)" />
      <label class="form-check-label" [for]="groupName + '-' + item.content">{{item.label}}</label>
    </div>
  }
</div>
