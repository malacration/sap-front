
<div class="card">
    <div class="card-body">
        <app-table [content]="$safeNavigationMigration(pageContent?.content)"
            [definition]="definition"
            (actionOutput)="action($event)"
            (cellClick)="abrir($event)">
        </app-table>
    </div>
    <div class="card-footer clearfix">
      <app-paginacao
        (pageChange)="pageChange($event)"
        [totalItens]="$safeNavigationMigration(pageContent?.totalElements)"
        [pageSize]="$safeNavigationMigration(pageContent?.size)"
      ></app-paginacao>
    </div>
</div>
