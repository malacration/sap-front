@if (analiseSelected == null) {
  <div class="card card-primary">
    <div class="card-header">
      <h3 class="card-title">Análises</h3>
    </div>
    <div class="card-body">
      <h5>Relatorios Salvos</h5>
      @for (it of relatoriosSalvos; track it) {
        <div>
          <div class="form-group">
            <button (click)="carregaAnalise(it)" class="btn btn-primary">{{it}} || Carregar</button>
            <button (click)="excluirAnalise(it)" class="btn btn-danger">Excluir</button>
          </div>
        </div>
      }
      <hr>
        <div class="row">
          <div class="form-group">
            <button (click)="criarAnalise()" class="btn btn-primary">Criar Análise</button>
          </div>
        </div>
      </div>
      @if (false) {
        <div class="overlay">
          <i class="fas fa-2x fa-sync-alt fa-spin"></i>
        </div>
      }
    </div>
  }


  @if (isSelectProduto()) {
    <selecao-produto-calc (solicitarProdutos)="solicitarProdutos($event)"></selecao-produto-calc>
  }

  @if (isFormacaoPreco()) {
    <formacao-preco [analise]="analiseSelected" (close)="fecharAnalise()"></formacao-preco>
  }

  @if (isCustoMercadoria()) {
    <custo-mercadoria
      (voltarEvnt)="custoMercadoriaVoltar()"
      [receita]="produtoSelecionado">
    </custo-mercadoria>
  }
