<section class="content">
  <div class="card card-primary">
    <div class="card-header">
      <h3 class="card-title">
        <b>{{ titulo }}</b>
        @if (filtro) {
          <span> · {{ nome || filtro.itemCode }}</span>
        }
      </h3>
    </div>

    <div class="card-body">
      @if (filtro) {
        <div class="text-muted small mb-3">
          {{ filtro.itemCode }}
          @if (detalhe) {
            · Venda das filiais {{ detalhe.filiais.join(', ') }}
          }
          <button type="button" class="btn btn-sm btn-outline-secondary ml-2" [disabled]="carregando" (click)="carregar()">
            <i class="fas fa-sync-alt"></i> Atualizar
          </button>
        </div>
      }

      @if (erro) {
        <div class="alert alert-danger" role="alert">
          <i class="fas fa-exclamation-circle mr-2"></i>{{ erro }}
        </div>
      }

      @if (detalhe) {
        <app-necessidade-producao-documentos [detalhe]="detalhe"></app-necessidade-producao-documentos>
      }
    </div>

    @if (carregando) {
      <div class="overlay">
        <i class="fas fa-2x fa-sync-alt fa-spin"></i>
      </div>
    }
  </div>
</section>
