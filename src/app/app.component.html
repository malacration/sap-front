@if (!isPublicRoute) {
  <app-header></app-header>
  <app-menu-sidebar class="sidebar-dark-primary"></app-menu-sidebar>
}

<div [class]="isPublicRoute ? '' : 'content-wrapper'">
  @if (!isPublicRoute && offlineContext.offlineEnabled) {
    <app-offline-status></app-offline-status>
  }
  @if (homologacao && !isPublicRoute) {
    <div class="row content hmg">
      <div class="rb-mp ribbon-wrapper ribbon-xl">
        <div class="ribbon bg-danger">
          Homologacao
        </div>
      </div>
    </div>
  }
  <section [class]="isPublicRoute ? '' : 'content content-mr pt-2'">
    <router-outlet></router-outlet>
  </section>
  @if (!isPublicRoute) {
    <br>
    }
  </div>
  <!-- <app-footer></app-footer> -->
  <!-- <app-control-sidebar></app-control-sidebar> -->
  @if (!isPublicRoute) {
    <div id="sidebar-overlay" (click)="onToggleMenuSidebar()"></div>
  }
