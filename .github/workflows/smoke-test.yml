name: Build and test
on:
  pull_request:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: cp src/config.example src/config
      - run: npm run web:build
      - run: npm test -- --browsers=ChromeHeadless
        env:
          CHROME_BIN: /usr/bin/google-chrome
      - name: Check web bundles
        run: |
          python3 -m http.server 8080 --bind 127.0.0.1 --directory dist > /tmp/http-server.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" 2>/dev/null || true' EXIT
          for _ in $(seq 1 30); do
            curl -fsS http://127.0.0.1:8080/ >/dev/null 2>&1 && break
            sleep 1
          done
          curl -fsS http://127.0.0.1:8080/ > /tmp/index.html
          grep -q '<app-root' /tmp/index.html
          MAIN_JS="$(grep -oE 'main[-.][^" ]+\.js' /tmp/index.html | head -n1)"
          test -n "$MAIN_JS"
          curl -fsS "http://127.0.0.1:8080/$MAIN_JS" > /dev/null
          test -s dist/ngsw.json
